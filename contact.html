<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="Contact Form Page">
   <link rel="stylesheet" href="style.css">
   <title>Contact Form - TA05</title>
</head>

<body>

   <!-- Header -->
   <header class="header">
      <h1>Contact Form</h1>
      <div class="date" id="current-date"></div>
   </header>

   <!-- Main layout container -->
   <div class="container">

      <!-- Sidebar Menu -->
      <aside class="sidebar">
         <h2>Menu</h2>
         <nav class="menu-buttons">
            <a href="index.html" class="menu-btn">Home</a>
            <a href="project1.html" class="menu-btn">Project 1</a>
            <a href="project2.html" class="menu-btn">Project 2</a>
            <a href="projects.html" class="menu-btn">All Projects</a>
            <a href="contact.html" class="menu-btn">Contact Form</a>
         </nav>
      </aside>

      <!-- Main content area -->
      <main class="form-main-content">

         <form class="contact-form">

            <label>Name and Surname</label>
            <input type="text" placeholder="Enter your answer">

            <label>Email</label>
            <input type="text" placeholder="Enter your answer">

            <label>Phone Number</label>
            <input type="text" placeholder="Enter your answer">

            <label>Additional comments</label>
            <input type="text" placeholder="Enter your answer">

            <button type="submit">Submit</button>

         </form>

      </main>
   </div>

   <!-- Footer WITH explanation inside -->
   <footer class="footer">
      <h2>Explanation</h2>
      <p>
         Use this form to send your contact information or any questions/feedback.
      </p>
      <p>© 2026 – All rights reserved.</p>
   </footer>

<script>
  const dateElement = document.getElementById("current-date");
  const today = new Date();
  const day = String(today.getDate()).padStart(2, '0');
  const month = String(today.getMonth() + 1).padStart(2, '0');
  const year = today.getFullYear();
  dateElement.textContent = `${day}/${month}/${year}`;
</script>

</body>
</html>
